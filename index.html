  <body>
    <noscript>

        html[data-pointer="hidden"],

    <!--
      The startup still (docs/ROOM.md › Startup): the room's own TV view, rendered by scripts/capture-tv-stills.mjs at
      one viewport per framing and placed here as the room will frame it (room/tv/tvFraming.ts), so it is the first
      picture on the page, before any script. The app lays the game's picture into it and fades it out as the live
      room takes over. Each framing's lengths are the capture's, in units of its container (the viewport):
      - set (landscape, tall enough for the whole set): fitted to the height and centred; 1440 × 608 at capture.
      - landscape (a phone on its side): the picture fills the height between the pad's clusters; 900 × 390.
      - portrait: the picture spans the width, centred above the touch pad's 228 px (or in the whole height); 390 × 900.
    -->
    <div id="tv-still" class="tv-still" data-shown="true" aria-hidden="true">
      <picture>
        <source media="(orientation: portrait)" srcset="/startup/tv-portrait.webp" />
        <source media="(max-height: 544.98px)" srcset="/startup/tv-landscape.webp" />
        <img class="tv-still__image" src="/startup/tv-desktop.webp" alt="" fetchpriority="high" />
      </picture>
    </div>
    <script>
      // The generated room (docs/ROOM.md › The generated room): its startup still is drawn below, not fetched.
      if (/[?&]room=generated(&|$)/.test(location.search)) {
        const still = document.getElementById("tv-still");
        still.className += " tv-still--drawn";
        still.innerHTML = "<i></i>";
      }
    </script>
    <style>
      /* The set at night as three boxes around the picture: its casing, the lip round the glass, the cabinet's top. */
      .tv-still--drawn {
        background: linear-gradient(#130e1a 60%, #181019);
      }
      .tv-still--drawn i,
      .tv-still--drawn i::before,
      .tv-still--drawn::after {
        position: absolute;
        content: "";
      }
      .tv-still--drawn::after {
        top: calc(var(--picture-top) + var(--picture-height) * 1.16);
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(#22161f, #2e1d28 70%, #1a1118 71%);
      }
      .tv-still--drawn i {
        z-index: 1;
        top: calc(var(--picture-top) - var(--picture-height) * 0.152);
        left: calc(var(--picture-left) - var(--picture-width) * 0.111);
        width: calc(var(--picture-width) * 1.231);
        height: calc(var(--picture-height) * 1.465);
        border-radius: calc(var(--picture-width) * 0.03);
        background: #050408;
        box-shadow: 0 calc(var(--picture-height) * 0.08) 0 calc(var(--picture-width) * -0.085) #030305;
      }
      .tv-still--drawn i::before {
        top: 7.4%;
        left: 7.1%;
        width: 85.2%;
        height: 74.8%;
        border-radius: calc(var(--picture-width) * 0.035);
        background: #000;
        box-shadow: 0 0 0 calc(var(--picture-width) * 0.004) #16131d;
      }
      .tv-still {
        position: fixed;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        background: #0c0a14;
        container-type: size;
        pointer-events: none;
        transition: opacity 400ms ease, visibility 0s 400ms;
        --picture-left: calc(50cqw - 36.788cqh);
        --picture-top: 14.549cqh;
        --picture-width: 73.573cqh;
        --picture-height: 55.145cqh;
      }
      .tv-still[data-shown="false"] {
        opacity: 0;
        visibility: hidden;
      }
      .tv-still__image {
        position: absolute;
        top: 0;
        left: calc(50cqw - 118.421cqh);
        display: block;
        height: 100cqh;
        user-select: none;
      }
      @media (orientation: landscape) and (max-height: 544.98px) {
        .tv-still {
          --picture-left: calc(50cqw - 71.423cqh);
          --picture-top: 0.1cqh;
          --picture-width: 133.615cqh;
          --picture-height: 99.8cqh;
        }
        .tv-still__image {
          left: calc(50cqw - 115.385cqh);
        }
      }
      @media (orientation: portrait) {
        .tv-still {
          --pad: 0px;
          --picture-left: 0.1cqw;
          --picture-top: calc(50cqh - var(--pad) / 2 - 37.556cqw);
          --picture-width: 99.8cqw;
          --picture-height: 75.113cqw;
        }
        .tv-still__image {
          top: calc(50cqh - var(--pad) / 2 - 86.154cqw);
          left: 0;
          width: 100cqw;
          height: auto;
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .tv-still {
          --pad: calc(228px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tv-still {
          transition: none;
        }
      }
      @media print {
        .tv-still {
          display: none;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
