    <!-- Social previews, on the production origin. A new preview render gets a new file name, so scrapers fetch it. -->

    <meta property="og:site_name" content="Roel Leenders" />
    <meta property="og:url" content="https://roel.work/" />

    <meta property="og:image:height" content="630" />

      name="twitter:description"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Roel Leenders",
        "jobTitle": "Product Engineer",
        "description": "Product engineer who takes ownership of features end to end, from user research and strategy to design and code.",
        "email": "mailto:rcleende@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Amsterdam", "addressCountry": "NL" },
        "worksFor": { "@type": "Organization", "name": "Scripe" },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "University of Twente" },
          { "@type": "CollegeOrUniversity", "name": "Avans University of Applied Sciences" }
        ],
        "knowsAbout": ["Product engineering", "AI agents", "React", "TypeScript", "Human–agent collaboration"],
        "sameAs": ["https://www.linkedin.com/in/roel-leendersit", "https://github.com/rcleend"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <style>
        /* The pointer waits for the first mouse move, which only the app can see. */
        html[data-pointer="hidden"],
        html[data-pointer="hidden"] * {
          /* biome-ignore lint/complexity/noImportantStyles: must beat the app stylesheet's own !important hiding. */
          cursor: auto !important;
        }
        .tv-still {
          display: none;
        }
        .noscript {
          max-width: 40rem;
          margin: 12vh auto;
          padding: 0 24px;
          color: #d9d0ff;
          font: 17px/1.6 system-ui, sans-serif;
        }
        .noscript h1 {
          margin: 0;
          font-size: 2rem;
          color: #fff;
        }
        .noscript a {
          color: #ffc83d;
        }
      </style>
      <main class="noscript">
        <h1>Roel Leenders</h1>
        <p>Product Engineer · Amsterdam, NL</p>
        <p>
          This portfolio is a 16-bit arcade game and needs JavaScript to run. The same story, as a plain résumé: a
          product engineer with eight years of experience building high-traffic, user-facing products, five of them at
          early-stage AI startups — most recently founding product engineer at Scripe (Berlin) and founding full-stack
          engineer at Luna, acquired by Zapier.
        </p>
        <p>
          <a href="mailto:rcleende@gmail.com">rcleende@gmail.com</a> ·
          <a href="https://www.linkedin.com/in/roel-leendersit" rel="me">LinkedIn</a> ·
          <a href="https://github.com/rcleend" rel="me">GitHub</a>
        </p>
      </main>
    </noscript>
    <!-- The startup still, drawn by the script the build puts after it: docs/ROOM.md › Startup. Every byte counts. -->
    <style>
      .tv-still {
        position: fixed;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: #1c1a21;
        pointer-events: none;
        transition: opacity 400ms ease, visibility 0s 400ms;
      }
      .tv-still svg,
      .tv-still i {
        position: absolute;
        inset: 0;
      }
      .tv-still text {
        font-family: Helvetica, Arial, sans-serif;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
        white-space: pre;
      }
      .tv-still .o {
        opacity: 0;
      }
      .tv-still:has([data-powered="true"]) .o {
        opacity: 1;
      }
      /* The still's image, once it is in (still/inline.ts): each surface's piece of it over that surface's gradients,
         and what the pieces have in them (the print, the jacks, the filament) no longer drawn. */
      .tv-still .p {
        inset: auto;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        background: var(--p) no-repeat;
        opacity: 0;
      }
      .tv-still[data-image] .p {
        opacity: 1;
        transition: opacity 200ms;
      }
      .tv-still[data-image] .v {
        display: none;
      }
      /* The picture's light: the drawing that has it takes --tube from the still, and nothing else does. */
      @property --tube {
        syntax: "<color>";
        inherits: false;
        initial-value: #000;
      }
      .tv-still .t {
        --tube: inherit;
        color: var(--tube);
        mix-blend-mode: screen;
      }
      .tv-still[data-shown="false"] {
        opacity: 0;
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .tv-still,
        .tv-still[data-image] .p {
          transition: none;
        }
      }
      @media print {
        .tv-still {
          display: none;
        }
      }
    </style>
    <div id="tv-still" class="tv-still" data-shown="true" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
