    <!--
      The startup still (docs/ROOM.md › Startup): the room's TV view drawn in CSS, placed as the room will frame it
      (room/tv/tvFraming.ts), so it is the first picture on the page, before any script and without a request. The app
      lays the game's picture into it and fades it out as the live room takes over. The set at night is three boxes
      around the picture (its casing, the lip round the glass, the cabinet's top); each framing's lengths are the
      live picture's (`__tvPicture()` in development), in units of the still's container (the viewport):
      - set (landscape, tall enough for the whole set): fitted to the height and centred.
      - landscape (a phone on its side): the picture fills the height between the pad's clusters.
      - portrait: the picture spans the width, centred above the touch pad's 228 px (or in the whole height).
    -->
    <div id="tv-still" class="tv-still" data-shown="true" aria-hidden="true"><i></i></div>
    <style>
      .tv-still i,
      .tv-still i::before,
      .tv-still::after {
        position: absolute;
        content: "";
      }
      .tv-still::after {
        top: calc(var(--picture-top) + var(--picture-height) * 1.136);
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(
          #23131a,
          #41262d calc(var(--picture-height) * 0.04),
          #765250 calc(var(--picture-height) * 0.2),
          #553942 calc(var(--picture-height) * 0.326),
          #2c1926 calc(var(--picture-height) * 0.33)
        );
      }
      .tv-still i {
        z-index: 1;
        top: calc(var(--picture-top) - var(--picture-height) * 0.148);
        left: calc(var(--picture-left) - var(--picture-width) * 0.115);
        width: calc(var(--picture-width) * 1.23);
        height: calc(var(--picture-height) * 1.451);
        border-radius: calc(var(--picture-width) * 0.03);
        background: #080409;
        box-shadow: 0 calc(var(--picture-height) * 0.24) 0 calc(var(--picture-width) * -0.0937) #030103;
      }
      .tv-still i::before {
        top: 6.25%;
        left: 6.76%;
        width: 86.5%;
        height: 76.9%;
        border-radius: calc(var(--picture-width) * 0.03);
        background: #0d0f11;
        box-shadow: 0 0 0 calc(var(--picture-width) * 0.0106) #362836;
      }
      .tv-still {
        position: fixed;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        background: linear-gradient(90deg, #120b17, #1b111e 45%, #3d2a38);
        container-type: size;
        pointer-events: none;
        transition: opacity 400ms ease, visibility 0s 400ms;
        --picture-left: calc(50cqw - 36.788cqh);
        --picture-top: 14.549cqh;
        --picture-width: 73.573cqh;
        --picture-height: 55.145cqh;
      }
      .tv-still[data-shown="false"] {
        opacity: 0;
        visibility: hidden;
      }
      @media (orientation: landscape) and (max-height: 544.98px) {
        .tv-still {
          --picture-left: calc(50cqw - 71.423cqh);
          --picture-top: 0.1cqh;
          --picture-width: 133.615cqh;
          --picture-height: 99.8cqh;
        }
      }
      @media (orientation: portrait) {
        .tv-still {
          --pad: 0px;
          background: #170e19;
          --picture-left: 0.1cqw;
          --picture-top: calc(50cqh - var(--pad) / 2 - 37.556cqw);
          --picture-width: 99.8cqw;
          --picture-height: 75.113cqw;
        }
        /* From closer and lower the cabinet's top is an edge under the set's plinth, its front below. */
        .tv-still::after {
          top: calc(var(--picture-top) + var(--picture-height) * 1.42);
          background: linear-gradient(#3b2539, #2e1c2c 8px);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .tv-still {
          --pad: calc(228px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tv-still {
          transition: none;
        }
      }
      @media print {
        .tv-still {
          display: none;
        }
      }
    </style>
