<!doctype html>
<html lang="en" data-pointer="hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Roel Leenders — Product Engineer</title>
    <meta
      name="description"
      content="Roel Leenders is a product engineer who owns features end to end, from user research and strategy to design and code. Play his portfolio as a 16-bit arcade game, or read the résumé."
    />
    <meta name="author" content="Roel Leenders" />
    <meta name="application-name" content="reo-leo-arcade" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social previews. og:image is root-relative until the site's public origin is known. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Roel Leenders" />
    <meta property="og:title" content="Roel Leenders — Product Engineer" />
    <meta
      property="og:description"
      content="A product engineer who owns features end to end. Play the portfolio as a 16-bit arcade game on a CRT in an attic, or read the résumé."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A CRT television in a night-time attic room showing Roel's arcade portfolio." />
    <meta property="profile:first_name" content="Roel" />
    <meta property="profile:last_name" content="Leenders" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roel Leenders — Product Engineer" />
    <meta
      name="twitter:description"
      content="A product engineer who owns features end to end. Play the portfolio as a 16-bit arcade game, or read the résumé."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Roel Leenders",
        "jobTitle": "Product Engineer",
        "description": "Product engineer who takes ownership of features end to end, from user research and strategy to design and code.",
        "email": "mailto:rcleende@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Amsterdam", "addressCountry": "NL" },
        "worksFor": { "@type": "Organization", "name": "Scripe" },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "University of Twente" },
          { "@type": "CollegeOrUniversity", "name": "Avans University of Applied Sciences" }
        ],
        "knowsAbout": ["Product engineering", "AI agents", "React", "TypeScript", "Human–agent collaboration"],
        "sameAs": ["https://www.linkedin.com/in/roel-leendersit", "https://github.com/rcleend"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <style>
        /* The pointer waits for the first mouse move, which only the app can see. */
        html[data-pointer="hidden"],
        html[data-pointer="hidden"] * {
          /* biome-ignore lint/complexity/noImportantStyles: must beat the app stylesheet's own !important hiding. */
          cursor: auto !important;
        }
        .noscript {
          max-width: 40rem;
          margin: 12vh auto;
          padding: 0 24px;
          color: #d9d0ff;
          font: 17px/1.6 system-ui, sans-serif;
        }
        .noscript h1 {
          margin: 0;
          font-size: 2rem;
          color: #fff;
        }
        .noscript a {
          color: #ffc83d;
        }
      </style>
      <main class="noscript">
        <h1>Roel Leenders</h1>
        <p>Product Engineer · Amsterdam, NL</p>
        <p>
          This portfolio is a 16-bit arcade game and needs JavaScript to run. The same story, as a plain résumé: a
          product engineer with eight years of experience building high-traffic, user-facing products, five of them at
          early-stage AI startups — most recently founding product engineer at Scripe (Berlin) and founding full-stack
          engineer at Luna, acquired by Zapier.
        </p>
        <p>
          <a href="mailto:rcleende@gmail.com">rcleende@gmail.com</a> ·
          <a href="https://www.linkedin.com/in/roel-leendersit" rel="me">LinkedIn</a> ·
          <a href="https://github.com/rcleend" rel="me">GitHub</a>
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
