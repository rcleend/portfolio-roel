<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radio lab</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b14; color: #cfd6e6; font: 12px/1.4 ui-monospace, monospace; }
      #backdrop { position: fixed; inset: 0; padding: 0; border: 0; outline: none; cursor: zoom-out;
        background: radial-gradient(ellipse at 62% 70%, #3a2433 0, #1c1424 38%, #0b0910 75%); }
      #stage { position: fixed; inset: 0; pointer-events: none; }
      #stage > * { pointer-events: auto; }
      /* A stand-in for the CFD-V31L on its cabinet, drawn where the room would project it. */
      .fake-radio { position: fixed; box-sizing: border-box; border-radius: 10px 10px 6px 6px; background: linear-gradient(#d9d1bf, #b7ae99 70%, #8f8775);
        box-shadow: 0 24px 60px #000c, inset 0 2px #f1ead9; cursor: default; }
      .fake-radio::before, .fake-radio::after { content: ""; position: absolute; top: 18%; width: 22%; aspect-ratio: 1; border-radius: 50%;
        background: repeating-radial-gradient(circle, #2a2a2e 0 2px, #3a3a40 2px 4px); box-shadow: inset 0 0 0 4px #9e9684; }
      .fake-radio::before { left: 6%; } .fake-radio::after { left: 30%; }
      .fake-radio__lcd { position: absolute; left: 42%; top: 12%; width: 17%; padding: 2px 6px; box-sizing: border-box; border-radius: 2px;
        font: 600 11px/1.6 ui-monospace, monospace; letter-spacing: 0.08em; color: #15261c; background: #c4ecd0; white-space: nowrap; overflow: hidden; }
      .fake-radio__lcd[data-kind="off"], .fake-radio__lcd:empty { background: #3a3d38; color: transparent; }
      .fake-well { position: fixed; border-radius: 50%; background: radial-gradient(#1b1c20 55%, #0c0c0e); box-shadow: inset 0 3px 8px #000; cursor: pointer; }
      .fake-key { position: fixed; border-radius: 3px; background: #6d685d; box-shadow: inset 0 -2px #4b473f, 0 1px #e6dfcd; cursor: pointer; transition: transform 60ms; }
      .fake-key[data-pressed="true"] { transform: translateY(1.5px); filter: brightness(0.82); }
      .fake-disc { position: fixed; left: 0; top: 0; border-radius: 50%; overflow: hidden; cursor: pointer;
        background: conic-gradient(from 30deg, #c9cdd6, #f2f4f8, #9aa1ad, #e7e9ef, #b0b6c1, #c9cdd6);
        box-shadow: 0 10px 30px #0008; transition: transform 420ms cubic-bezier(.3, 0, .2, 1), width 300ms, height 300ms; }
      .fake-disc__print { position: absolute; inset: 0; width: 100%; height: 100%; }
      .fake-disc::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; background: radial-gradient(#0d0b14 23%, #2b2d33 24%); }
      .fake-disc[data-spinning="true"] .fake-disc__print { animation: fake-spin 0.4s linear infinite; }
      .fake-disc[data-attended="true"] { box-shadow: 0 16px 40px #000a, 0 0 0 1px #fff4; }
      @keyframes fake-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .fake-disc { transition: none; } .fake-disc[data-spinning="true"] .fake-disc__print { animation: none; } }
      #controls { position: fixed; inset: 0; pointer-events: none; }
      .fake-controls { position: absolute; inset: 0; }
      #panel { position: fixed; left: 8px; top: 8px; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      #panel button { font: inherit; background: #1b2030; color: inherit; border: 1px solid #39425c; padding: 4px 8px; cursor: pointer; }
      #status { padding: 4px 8px; background: #0d1018cc; }
      body.clean #panel { display: none; }
    </style>
  </head>
  <body>
    <button id="backdrop" type="button" aria-label="Look around the room (lab)"></button>
    <div id="stage"></div>
    <div id="controls"></div>
    <div id="panel">
      <button type="button" data-action="radio">radio</button>
      <button type="button" data-action="room">room</button>
      <button type="button" data-action="pc">pc</button>
      <button type="button" data-action="tv">tv</button>
      <button type="button" data-action="mute">mute</button>
      <span id="status">loading…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/radio/lab/main.tsx"></script>
  </body>
</html>
